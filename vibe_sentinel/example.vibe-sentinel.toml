# Anything matching acme-* is ours and the names are deliberate.
# Our vendored forks keep the upstream name with a -fork suffix.
# """
#
# A pin records a decision you actually made, scoped to the finding kinds it
# names — accepting "orphan" for a package does not accept "squatted" later.
#
# [[packages.pin]]
# packages = ["some-tool"]
# accept   = ["orphan"]
# reason   = """Installed deliberately for local profiling; never imported."""
