# Your standing note about your own names, put in front of the one question
# this gate asks. `httpx` and `httpx2` are two real packages and nothing
# outside your ecosystem knows that; a pin records it after the finding, this
# says it before the question. Same shape as the [licenses] and [drift] notes.
