# --- Credentials at rest ------------------------------------------------------
# Passwords and keys sitting on disk: the files whose whole purpose is holding
# them (.env, ~/.aws/credentials, terraform state) and the ones hardcoded into
# ordinary source. Patterns find candidates; the LOCAL model decides which are
# real, because no regex can tell a live key from the one in the vendor's own
# documentation.
#
#     vibe-sentinel credentials              # 0 clean, 1 findings, 2 error
#     vibe-sentinel credentials --home       # also the credential stores in
#                                            # your home directory
#     vibe-sentinel credentials --print-rules
#
# This is the one check that reads secrets, so it refuses to send an excerpt
# anywhere but loopback. Point [llm] endpoint at another host and it stops
# rather than posting your keys to it. Values reach the local model as a short
# prefix plus their shape (length, entropy) — never in full, and never at all
# to the terminal, the log, or the history database.
#
# [credentials]
#
# The separate, optional rule: a credential in a file git ignores.
#   allow   not a finding. Your .env is the sanctioned way to hold a local
#           development key and you do not want to hear about it.
#   warn    reported, does not fail the gate. The default.
#   deny    fails like any other.
# We recommend deny, and the reason is about agents rather than about git:
# .gitignore keeps a file out of a commit and does nothing about the file. An
# agent with a shell reads .env with `cat` regardless. The only version of
# this an agent cannot read by accident is the one where the secret is in the
# OS keychain and never on disk.
# gitignored = "warn"
#
# exclude = ["docs/examples/*"]     # globs, relative to the project root
# max_file_kb = 512                 # bigger files are flagged by name, not read
# max_files = 20000
# reveal_chars = 8                  # leading chars shown to the LOCAL model, so
#                                   # `sk-ant-` can be told from a placeholder.
#                                   # Never more than half the value. 0 sends
#                                   # only the shape.
# concurrency = 1                   # as with [safety]: raise it for a server
#                                   # that batches
# allow_remote_model = false        # true only if you own that endpoint and
#                                   # meant to send credentials to it
#
# Layering is the same as probes and dangers:
#   new [[secret]] id       adds a rule
#   built-in [[secret]] id  overrides that built-in
#   [credentials] use       keeps ONLY the ones you name
#   [credentials] disable   switches one off, without restating the rest
#   [credentials] use_builtins  false to check only for what you declare
#   [credentials] rule_files = ["rules/*.toml"]
#
# [[secret]]
# id = "our-service-keys"
# title = "A key minted by our own auth service"
# pattern = 'acme_(live|test)_[A-Za-z0-9]{24,}'
# verdict = "real"            # optional: decide it here, never ask. A live-
#                             # prefixed key of ours is real by construction.
# question = """
# Is this one of our service keys? acme_live_ keys reach production; acme_test_
# keys reach the sandbox, which holds no customer data.
# """
#
# [[secret]]
# id = "ansible-vault"
# title = "An Ansible vault file"
# applies_to = "path"         # match the file's name instead of its lines
# pattern = '(^|/)group_vars/.*/vault\.ya?ml$'
# question = "Is this encrypted, or was it committed before the encrypt step?"
#
# Pins: findings accepted on a reason you recorded, scoped to the rules they
# name — accepting "private-key-file" for a fixtures path does not accept
# "assigned-secret" there later. A pin is not an ignore.
#
# [[credentials.pin]]
# paths    = ["tests/fixtures/*.pem"]
# accept   = ["private-key-file"]
# reason   = """Generated by tests/make_certs.sh for the TLS handshake tests.
# Never deployed, never trusted by anything outside the test suite."""
# verified = "2026-01-15"


# --- Accepted vulnerabilities ------------------------------------------------
# Allowlist only what a version bump cannot fix — a stale entry is review debt
# that hides the next real finding. Record the reason and a review date.
#
# [security]
# ignore_vulnerabilities = [
#     "PYSEC-2026-1234",             # no fix upstream; review 2026-12
# ]

# --- Probes ------------------------------------------------------------------
# The built-in probes are the base layer. Your entries merge on top:
#
#   new [[probe]] id       adds a probe
#   built-in [[probe]] id  overrides that built-in
#   [probes] disable       switches one off, without restating the rest
#   [probes] use_builtins  false to start from nothing and run only yours
#
#     vibe-sentinel scan --print-probes     see what the built-ins are
#     vibe-sentinel scan --probes id,id     run a subset, this run only
#
# [probes]
# disable = ["pattern-census"]
# use_builtins = true
#
# A probe is any command that prints:
#     {"observations": [{"key": "...", "value": 1.0, "label": "..."}],
#      "summary": "..."}
#
# `key` must be stable between runs — it is what makes a value comparable,
# and what makes a key you have never seen before a finding on its own.
#
# `tolerance` is how far a value may move before that counts as drift. A bare
# number is absolute, in the value's own units — 0.05 on a ratio is five
# points, 0 means any change surfaces. A percentage string, "15%", is
# relative to the value it is compared against, which is the form a magnitude
# needs: no single absolute number is right at both ends of a range.
#
# Ask what your codebase should still look like in a year, then measure the
# thing that would have to change for that to stop being true.
