# The secret rule set vibe-sentinel ships with.
#
# What the credentials gate treats as a candidate worth judging. Layered
# exactly like `probes.default.toml` and `dangers.default.toml`: a `[[secret]]`
# in your own `.vibe-sentinel.toml` with a new `id` adds one, one reusing an id
# here overrides it.
#
# A rule nominates; it never convicts. `applies_to = "path"` flags a file by
# its name, `applies_to = "content"` by what a line in it looks like, and the
# model is then asked `question` about the candidate — with the value reduced
# to a prefix and a shape, never sent whole. A `verdict` settles an entry
# without asking, which is how a project says "this one is always a real key"
# or "this one never is".
#
# Shipped as data for the same reason the dangers are: a shipped list of key
# formats cannot know which prefix your own auth service mints.

[[secret]]
id = 'dotenv-file'
title = 'An environment file'
question = """\
    Does this file hold real credentials, or is it the template — the \
    committed .env.example whose values are all placeholders? A single \
    real value pasted into a template file is the finding; the rest of the \
    placeholders around it are not."""
pattern = '(^|/)\.env(\.[^/]*)?$|(^|/)env\.(sh|list)$'
applies_to = 'path'

[[secret]]
id = 'private-key-file'
title = 'A private key file'
question = """\
    Is this a private key, and does it still open anything? A public \
    certificate, a CA bundle, or a key generated for a test that was never \
    deployed is not a leak — say which of those it is."""
pattern = '(^|/)id_(rsa|dsa|ecdsa|ed25519)$|\.(pem|key|p8|p12|pfx|jks|keystore|ppk|asc|gpg)$'
applies_to = 'path'

[[secret]]
id = 'cloud-credentials'
title = "A cloud provider's credential file"
question = """\
    Does this hold usable cloud credentials — a long-lived access key or a \
    service-account private key — or only a profile name, a region, and a \
    reference to credentials held elsewhere?"""
pattern = '(^|/)\.aws/(credentials|config)$|(^|/)\.azure/(credentials|accessTokens\.json)$|(^|/)(application_default_)?credentials\.json$|(^|/)[^/]*service[_-]?account[^/]*\.json$|(^|/)\.s3cfg$'
applies_to = 'path'

[[secret]]
id = 'registry-auth'
title = 'A package or container registry login'
question = """\
    Does this contain an auth token or password, or only registry URLs and \
    settings? A token here publishes packages under your name."""
pattern = '(^|/)\.npmrc$|(^|/)\.pypirc$|(^|/)\.netrc$|(^|/)_netrc$|(^|/)\.gem/credentials$|(^|/)\.cargo/credentials(\.toml)?$|(^|/)\.docker/config\.json$|(^|/)\.composer/auth\.json$'
applies_to = 'path'

[[secret]]
id = 'vcs-credentials'
title = 'A stored version-control login'
question = """\
    Does this hold a personal access token? One here reaches every \
    repository the account can see, not only this one."""
pattern = '(^|/)\.git-credentials$|(^|/)gh/hosts\.ya?ml$'
applies_to = 'path'

[[secret]]
id = 'database-credentials'
title = 'A stored database password'
question = """\
    Does this hold a password, and does the host it names look like \
    something with real data behind it?"""
pattern = '(^|/)\.pgpass$|(^|/)\.my\.cnf$|(^|/)\.mylogin\.cnf$|(^|/)\.dbeaver-data-sources[^/]*\.json$'
applies_to = 'path'

[[secret]]
id = 'cluster-config'
title = 'A cluster or orchestration config'
question = """\
    Does this embed a client certificate, token, or password, or does it \
    delegate to an external credential helper? A kubeconfig with an \
    embedded token is a key to the cluster."""
pattern = '(^|/)\.kube/config$|(^|/)kubeconfig(\.[^/]*)?$'
applies_to = 'path'

[[secret]]
id = 'infrastructure-state'
title = 'Infrastructure variables or state'
question = """\
    Does this contain credentials? Terraform state stores every attribute \
    it manages in clear text, including the passwords and keys resources \
    were created with, so a state file is usually the richest single \
    secret in a repository."""
pattern = '\.auto\.tfvars(\.json)?$|(^|/)[^/]*\.tfvars(\.json)?$|(^|/)terraform\.tfstate(\.backup)?$|\.tfstate$'
applies_to = 'path'

[[secret]]
id = 'secret-store-file'
title = 'A file that says it holds secrets'
question = """\
    Does this hold live values, or is it a schema, a sealed/encrypted \
    blob, or a list of key names with the values fetched elsewhere?"""
pattern = '(^|/)(secrets?|credentials?|passwords?|vault)\.(ya?ml|json|toml|ini|cfg|conf|properties|txt|enc)$'
applies_to = 'path'

[[secret]]
id = 'shell-history'
title = 'A shell history file'
question = """\
    Does any line here carry a credential — an `export TOKEN=...`, a \
    `psql` or `curl` invocation with a password in it? Agents export keys \
    to run one command and the shell keeps the line forever."""
pattern = '(^|/)\.(bash|zsh|ksh|sh|node_repl|python|psql|mysql)_history$|(^|/)\.local/share/fish/fish_history$'
applies_to = 'path'

[[secret]]
id = 'private-key-block'
title = 'A private key pasted into a file'
question = """\
    This is a private key block inside a file that is not a key file. Is \
    it a real key? A fixture generated for a test suite is not a leak — \
    but say so explicitly, because anything shaped like this will be \
    treated as a key by whatever reads it next."""
pattern = '-----BEGIN\s+(?:RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'

[[secret]]
id = 'cloud-access-key'
title = 'A cloud access key id'
question = """\
    Is this a real access key id, or the one from the provider's own \
    documentation? AKIAIOSFODNN7EXAMPLE and AKIAIOSFODNN7EXAMPLE-style ids \
    appear in every AWS tutorial ever written and are not credentials. A \
    key id with a matching secret beside it is."""
pattern = '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b|\bAIza[0-9A-Za-z_\-]{35}\b'

[[secret]]
id = 'provider-token'
title = 'A token with a recognisable vendor prefix'
question = """\
    These prefixes are issued by one vendor and mean the string was minted \
    by them. Is this one live, or has it been revoked or redacted? Note \
    that a `_test_` key is still a key, to a sandbox."""
pattern = '\bgh[pousr]_[A-Za-z0-9]{30,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b|\bglpat-[A-Za-z0-9_\-]{16,}\b|\bxox[abposr]-[A-Za-z0-9-]{10,}\b|\bsk-ant-[A-Za-z0-9_\-]{20,}\b|\bsk-(?:proj-)?[A-Za-z0-9_\-]{32,}\b|\b[sr]k_(?:live|test)_[A-Za-z0-9]{16,}\b|\bSG\.[A-Za-z0-9_\-]{16,}\.[A-Za-z0-9_\-]{16,}\b|\bnpm_[A-Za-z0-9]{30,}\b|\bdop_v1_[a-f0-9]{40,}\b|\bhf_[A-Za-z0-9]{30,}\b|\bAC[0-9a-f]{32}\b'

[[secret]]
id = 'assigned-secret'
title = 'A name that means secret, assigned a literal'
question = """\
    Is the assigned value a real credential? Most are not: test fixtures, \
    sample data, a documented default, the string 'changeme'. Judge the \
    value, not the variable name — and if it reads as a credential for \
    something that exists, say so."""
pattern = '''(?i)(?<![A-Za-z0-9])(?:pass(?:wd|word|phrase)?|pwd|secret|token|pat|bearer|dsn|salt|credential|api[_\-]?key|access[_\-]?key|private[_\-]?key|client[_\-]?secret|auth[_\-]?key|(?:signing|session|encryption|master)[_\-]?key)s?(?:[_\-][A-Za-z0-9]+)*\b[\"']?\s*[:=]{1,2}\s*[\"']([^\"'\n]{6,})[\"']'''

[[secret]]
id = 'connection-string'
title = 'A password inside a connection URL'
question = """\
    This URL carries a password in it. Does the host it points at hold \
    anything real — is it localhost, a docker-compose service, a test \
    container, or something reachable?"""
pattern = '''\b[a-z][a-z0-9+.\-]{2,}://[^\s:@/\"']{1,64}:([^\s:@/\"']{3,})@'''

[[secret]]
id = 'authorization-header'
title = 'An authorization header with a value in it'
question = """\
    Is this a real token, or a documentation example / a value substituted \
    at run time? A Basic header is base64 of user:password — decode it \
    before deciding."""
pattern = '''(?i)authorization[\"']?\s*[:=]\s*[\"']?\s*(?:bearer|basic|token)\s+([A-Za-z0-9._\-+/=]{16,})'''

[[secret]]
id = 'minted-token'
title = 'A long dense value that looks generated'
question = """\
    Nothing about this name says secret and the value carries no vendor \
    prefix — it was flagged for its shape: long, dense, mixed case. That \
    is what a minted credential looks like, and it is also what a git SHA, \
    a checksum, a UUID and a base64 blob of test data look like. Say which \
    this is."""
pattern = '''(?<![A-Za-z0-9])[\w.\-]{1,64}[\"']?\s*[:=]{1,2}\s*[\"']([A-Za-z0-9+/=_\-]{32,})[\"']'''

[[secret]]
id = 'password-shape'
title = 'A short token that looks typed rather than written'
question = """\
    A short single token with digits or symbols glued into the letters. \
    Code joins words with a separator and a person typing a password does \
    not, which is the whole signal here — it is a weak one. A model name, \
    an image tag, a release channel and a digest algorithm are all this \
    shape and none is a credential. Judge the value: `hunter22` is eight \
    low-entropy characters and it is also somebody's password."""
pattern = '''(?<![A-Za-z0-9])[\w.\-]{1,64}[\"']?\s*[:=]{1,2}\s*[\"']([^\s\"'\n]{6,24})[\"']'''

[[secret]]
id = 'json-web-token'
title = 'A JSON Web Token'
question = """\
    A JWT's payload is base64, not encryption — decode it. What does it \
    grant, who issued it, and has it expired? An expired token from a test \
    run is not a leak; a service token with no expiry is."""
pattern = '\beyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\b'
