[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-sentinel"
version = "0.6.0"
description = "Safeguards a codebase against the problems AI coding agents introduce: structural drift, secrets at rest, unvetted dependencies, and dangerous commands."
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "Olga Vine" },
    { name = "Sergey Samsonau" },
]
maintainers = [{ name = "Authentic Research Partners LLC", email = "oss@arpconnect.com" }]
readme = "README.md"
keywords = [
    "code-organization",
    "architecture",
    "structural-drift",
    "codebase-inventory",
    "guardrails",
    "ai-agents",
    "coding-agent",
    "llm",
    "local-llm",
    "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "loguru>=0.7",
    "packaging>=24",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://arpconnect.com"
Repository = "https://github.com/authentic-research-partners/vibe-sentinel"
Documentation = "https://github.com/authentic-research-partners/vibe-sentinel#readme"
Issues = "https://github.com/authentic-research-partners/vibe-sentinel/issues"

[project.optional-dependencies]
plugin = ["mcp>=1.20,<2"]
# `uv pip install -e ".[dev]"` brings in every tool used by the mandatory
# checks and the release pipeline.
dev = [
    "mcp>=1.20,<2",
    # Mandatory checks — run after every code change
    "pytest>=9.0.3",
    "pytest-xdist>=3.0",
    "ruff>=0.15",
    "mypy>=1.18",
    "ast-grep-cli>=0.35",
    # Release pipeline
    "deptry>=0.25",
    "bandit>=1.9",
    "pip-audit>=2.10",
    "build>=1.0",
    "twine>=6.0",
]

[project.scripts]
vibe-sentinel = "vibe_sentinel.__main__:main"
vibe-sentinel-mcp = "vibe_sentinel.mcp_server:main"

[tool.setuptools.packages.find]
include = ["vibe_sentinel*"]

[tool.setuptools.package-data]
"vibe_sentinel" = [
    "example.vibe-sentinel.toml",
    "probes.default.toml",
    "dangers.default.toml",
    "secrets.default.toml",
    "security-rules.yml",
    "security-jsx.cjs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No `markers` table: nothing is marked. Every test here runs without a
# GPU, because an autouse fixture in conftest.py stubs `llm_query` rather
# than because the package has a model-free path — it does not. So a
# declared `integration` marker that no test carried was describing a
# suite this project does not have. Declare one again in the same commit
# that marks a test with it.
addopts = "-n auto -p no:cacheprovider"

[tool.bandit]
skips = [
    "B101",  # assert — used for type narrowing and internal invariants
    "B404",  # subprocess import — CLI tool, subprocess is core functionality
    "B603",  # subprocess call — probes and [llm] start_command, by design
    "B607",  # partial path — backend commands resolved via PATH
    "B615",  # HF from_pretrained without revision pin — trusted publisher
]

[tool.deptry]
# Everything in [dev] is a command-line tool — ruff, mypy, pytest,
# ast-grep, the release gates. They are invoked as commands, never
# imported, so deptry must not expect an import for them.
optional_dependencies_dev_groups = ["dev"]

[tool.mypy]
plugins = ["pydantic.mypy"]

# === Ruff =====================================================================
# Enforces the subset of the project's antipatterns that ruff can express.
# The rest — the semantic ones — are what vibe-sentinel itself is for.
[tool.ruff.lint]
# `select`, not `extend-select`: extend-select adds to whatever ruff's
# DEFAULT set happens to be, and that set changes between ruff releases
# — 0.16 widened it enough to raise hundreds of new findings on
# unchanged code. A lint gate that shifts under a routine tool upgrade
# can't be trusted to gate anything, so the rule set is stated in full
# here. E4/E7/E9/F are ruff's classic default; the rest are the codes
# mapped to this project's documented antipatterns.
#
# To adopt a new rule, add its code here deliberately. Whole-category
# selects (e.g. "B", "ASYNC") would pull in unrelated rules and
# reintroduce the same drift.
select = [
    "E4",       # pycodestyle — imports
    "E7",       # pycodestyle — statements
    "E9",       # pycodestyle — runtime errors
    "F",        # pyflakes
    "S110",     # try-except-pass (silent swallow)
    "S112",     # try-except-continue (silent swallow)
    "T201",     # print() in library code
    "B006",     # mutable default args
    "B008",     # function call in default arg
    "B023",     # late-binding closure
    "B904",     # raise-without-from in except
    "ASYNC210", # sync HTTP (httpx.Client) in async
    "ASYNC251", # time.sleep in async
    "TID251",   # flake8-tidy-imports banned-api (configured below)
]

[tool.ruff.lint.per-file-ignores]
# User-facing output surfaces. print() IS the output channel here.
"vibe_sentinel/cli.py" = ["T201"]
"vibe_sentinel/__main__.py" = ["T201"]
"vibe_sentinel/report.py" = ["T201"]
"vibe_sentinel/backend.py" = ["T201"]
# Probes speak a stdout protocol; print() is how they emit it.
"vibe_sentinel/probes/*.py" = ["T201"]
# The one module in the package that may use dataclasses: the hook
# payload's models. The PreToolUse hook
# runs once per tool call, and pydantic alone cost ~55 ms of it — for
# validation this boundary never wants. It wants the opposite: a payload
# field of an unexpected type must cost that field, not the whole event.
# Full justification in vibe_sentinel/journal.py's docstring.
"vibe_sentinel/journal.py" = ["TID251"]
# Claude Code's payload, moved out of journal.py into its adapter: the same
# boundary, the same per-call cost, the same reason.
"vibe_sentinel/agents/claude_code.py" = ["TID251"]
# Same reason again: `safety.py` decides whether to escalate in front of
# every tool call, so the danger set has to load without building a
# pydantic model. Its docstring carries the justification.
"vibe_sentinel/safety.py" = ["TID251"]
# The eval CLI, same reason as the tool's own: its report IS stdout.
# Everything else under evals/ logs through loguru like the package does.
"evals/__main__.py" = ["T201"]
# The benchmark CLI, for the third time: a table of durations is the
# output, not a diagnostic about it. Everything else under benchmarks/
# returns strings or logs, so this is the only file that needs it.
"benchmarks/__main__.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru — 'from loguru import logger'."
"dataclasses".msg = "Use pydantic BaseModel + Field for data models."
"dataclasses.dataclass".msg = "Use pydantic BaseModel for data models."
"dataclasses.field".msg = "Use pydantic Field(default_factory=...)."
"dataclasses.asdict".msg = "Use BaseModel.model_dump()."
