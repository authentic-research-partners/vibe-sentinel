# Frontend starter. See ../starter-profiles.md before the first scan.
# Custom commands use the `python` on PATH; it must import vibe_sentinel.
[probes]
use_builtins = false

[[probe]]
id = "source-lines"
title = "JavaScript, TypeScript, and stylesheet file lengths"
description = "Counts source lines per file, including tests under SOURCE_ROOT. TSX is measured as text, without component or import analysis."
command = [
    "python", "-m", "vibe_sentinel.probes.length",
    "--root", "{SOURCE_ROOT}",
    "--categories", "source=*.js,*.mjs,*.cjs,*.jsx,*.ts,*.mts,*.cts,*.tsx; styles=*.css,*.scss",
    "--unit", "lines",
]
tolerance = 0

[[probe.placeholders]]
name = "SOURCE_ROOT"
description = "Project-relative source root. Excluded dependency and build directories are skipped below it."
default = "."

[[probe]]
id = "source-asset-bytes"
title = "Source image and font bytes per file"
description = "Measures raw file bytes for declared image and font extensions. These are source assets, not a built bundle or a measure of browser transfer size."
command = [
    "python", "-m", "vibe_sentinel.probes.length",
    "--root", "{ASSET_ROOT}",
    "--categories", "images=*.png,*.jpg,*.jpeg,*.gif,*.webp,*.avif,*.svg,*.ico; fonts=*.woff,*.woff2",
    "--unit", "bytes",
]
tolerance = 0

[[probe.placeholders]]
name = "ASSET_ROOT"
description = "Project-relative source asset root. Must contain at least one matching file."
default = "."

[[probe]]
id = "fetch-typescript"
title = "Direct fetch call locations in TypeScript"
description = "Counts syntactic fetch(...) calls per directory in ast-grep's TypeScript input. No name resolution or network behavior is inferred."
command = [
    "python", "-m", "vibe_sentinel.probes.patterns",
    "--root", "{SOURCE_ROOT}", "--lang", "typescript",
    "--pattern", "fetch($$$ARGS)",
]
tolerance = 0

[[probe.placeholders]]
name = "SOURCE_ROOT"
description = "Project-relative root for the TypeScript pattern census."
default = "."

[[probe]]
id = "fetch-tsx"
title = "Direct fetch call locations in TSX"
description = "Counts syntactic fetch(...) calls per directory in ast-grep's TSX input. Does not identify React effects, components, or client/server boundaries."
command = [
    "python", "-m", "vibe_sentinel.probes.patterns",
    "--root", "{SOURCE_ROOT}", "--lang", "tsx",
    "--pattern", "fetch($$$ARGS)",
]
tolerance = 0

[[probe.placeholders]]
name = "SOURCE_ROOT"
description = "Project-relative root for the TSX pattern census."
default = "."

[[probe]]
id = "fetch-javascript"
title = "Direct fetch call locations in JavaScript"
description = "Counts syntactic fetch(...) calls per directory in ast-grep's JavaScript input. Aliases and member calls are outside this pattern."
command = [
    "python", "-m", "vibe_sentinel.probes.patterns",
    "--root", "{SOURCE_ROOT}", "--lang", "javascript",
    "--pattern", "fetch($$$ARGS)",
]
tolerance = 0

[[probe.placeholders]]
name = "SOURCE_ROOT"
description = "Project-relative root for the JavaScript pattern census."
default = "."
