<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title description">
  <title id="title">Vibe Sentinel: policy, checks and recorded evidence</title>
  <desc id="description">Declared rules guide three paths. Before tool execution, command safety uses recent history and can allow, ask or deny when enforcement is enabled. State gates check credentials, dependency provenance and licences. Probes and lenses measure and interpret structural drift. The local history stores tool requests, command reviews, scan findings and measurements. Pins in policy record exceptions with reasons and dates; accepting a scan baseline is a separate decision. The record is not proof of completed execution or a tamper-proof audit trail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#8795a8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #172b42; }
      .heading { font-size: 21px; font-weight: 650; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #52657b; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.3px; }
      .outcome { font-size: 18px; font-weight: 650; }
      .connector { fill: none; stroke: #8795a8; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- An explicit background keeps the diagram white in dark-mode viewers. -->
  <rect width="1040" height="720" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="718" rx="15" fill="none" stroke="#dce3eb"/>

  <text x="32" y="39" class="label" fill="#52657b">VIBE SENTINEL</text>
  <text x="1008" y="39" class="small" text-anchor="end">Local-first security &amp; governance</text>

  <!-- One declared policy feeds three distinct checks. -->
  <rect x="32" y="60" width="976" height="84" rx="12" fill="#f3f6fa" stroke="#dce3eb"/>
  <text x="520" y="94" class="heading" text-anchor="middle">Your rules. Your project context.</text>
  <text x="520" y="123" class="body" text-anchor="middle">Declared dangers · credential rules · licence policy · probes &amp; lens questions</text>
  <path class="connector" d="M188 144V181"/>
  <path class="connector" d="M520 144V181"/>
  <path class="connector" d="M852 144V181"/>

  <!-- Equal-height lanes keep the timing and outcomes easy to compare. -->
  <rect x="32" y="184" width="312" height="270" rx="12" fill="#f0f6ff" stroke="#c9dbf4"/>
  <text x="52" y="214" class="label" style="fill:#285b9c">BEFORE A TOOL CALL</text>
  <text x="52" y="249" class="heading">Command safety</text>
  <text x="52" y="280" class="body">Proposed action</text>
  <text x="52" y="305" class="body">+ recent command history</text>
  <text x="52" y="340" class="small">Review against declared dangers</text>
  <rect x="48" y="363" width="280" height="46" rx="8" fill="#ffffff" stroke="#c9dbf4"/>
  <text x="188" y="392" class="outcome" text-anchor="middle" style="fill:#285b9c">Allow · ask · deny</text>
  <text x="188" y="428" class="small" text-anchor="middle">Claude Code &amp; Cursor</text>
  <text x="188" y="447" class="small" text-anchor="middle">Choose journal, observe or enforce</text>

  <rect x="364" y="184" width="312" height="270" rx="12" fill="#eff8f5" stroke="#c8e4da"/>
  <text x="384" y="214" class="label" style="fill:#246b56">ON EACH SCAN</text>
  <text x="384" y="249" class="heading">Current-state gates</text>
  <text x="384" y="280" class="body">Credentials · provenance</text>
  <text x="384" y="305" class="body">Licence-policy checks</text>
  <text x="384" y="340" class="small">No previous scan needed</text>
  <rect x="380" y="363" width="280" height="46" rx="8" fill="#ffffff" stroke="#c8e4da"/>
  <text x="520" y="392" class="outcome" text-anchor="middle" style="fill:#246b56">Report standing findings</text>
  <text x="520" y="435" class="small" text-anchor="middle">Resolve cause or record a scoped pin</text>

  <rect x="696" y="184" width="312" height="270" rx="12" fill="#f5f2fc" stroke="#ddd3ef"/>
  <text x="716" y="214" class="label" style="fill:#6b4c99">ACROSS RECORDED SCANS</text>
  <text x="716" y="249" class="heading">Structural drift</text>
  <text x="716" y="280" class="body">Probes measure changes</text>
  <text x="716" y="305" class="body">Lenses judge significance</text>
  <text x="716" y="340" class="small">Baseline · horizons · fitted trends</text>
  <rect x="712" y="363" width="280" height="46" rx="8" fill="#ffffff" stroke="#ddd3ef"/>
  <text x="852" y="392" class="outcome" text-anchor="middle" style="fill:#6b4c99">Report measured changes</text>
  <text x="852" y="435" class="small" text-anchor="middle">Accept a new baseline explicitly</text>

  <path class="connector" d="M188 454V491"/>
  <path class="connector" d="M520 454V491"/>
  <path class="connector" d="M852 454V491"/>

  <!-- Storage and explicit acceptance are different parts of auditability. -->
  <rect x="32" y="494" width="976" height="103" rx="12" fill="#f3f6fa" stroke="#dce3eb"/>
  <text x="56" y="529" class="heading">A local record you can inspect</text>
  <text x="56" y="558" class="body">Tool requests &amp; command reviews · scan findings · measurements &amp; accepted baseline</text>
  <text x="56" y="581" class="small">Recorded history provides context for subsequent reviews and comparisons.</text>

  <text x="32" y="633" class="body" font-weight="650">Explicit decisions:</text>
  <text x="185" y="633" class="body">pins in policy carry a reason &amp; verification date; baseline updates accept drift.</text>
  <path d="M32 654H1008" stroke="#e5eaf0"/>
  <text x="32" y="682" class="small">Guardrails, not a sandbox. Tool requests are not proof of execution. Local history is not tamper-proof.</text>
</svg>
