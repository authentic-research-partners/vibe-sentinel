# Add this file to [probes] rule_files, or copy its declaration into your config.
[[probe]]
id = "openapi-artifact"
title = "OpenAPI artifact structure"
description = "Methods, paths, schema shapes and declared security attachments from an existing local JSON artifact. Runtime authorization and freshness are not assessed."
command = ["{SCANNER_PYTHON}", "-I", "-m", "vibe_sentinel.probes.openapi", "--root", "{ROOT}", "--artifact", "{ARTIFACT}"]
timeout_s = 60
tolerance = 0
compare_parameters = true

[[probe.placeholders]]
name = "SCANNER_PYTHON"
description = "Python in the Sentinel installation"
default = "python"

[[probe.placeholders]]
name = "ROOT"
description = "Project root containing the artifact"
default = "."

[[probe.placeholders]]
name = "ARTIFACT"
description = "Existing OpenAPI JSON file relative to ROOT"
default = "openapi.json"
